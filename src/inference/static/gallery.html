<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSOR LOGS // BORDER//VISION</title>
    <!-- Custom Brand URL Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <link rel="stylesheet" href="components/infinite-spiral/infinite-spiral.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'IBM Plex Mono', monospace;
        }

        #spiral-gallery {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 28px;
            left: 28px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: rgba(255,255,255,0.55);
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-radius: 8px;
            transition: color 0.25s, border-color 0.25s, background 0.25s;
        }
        .back-btn:hover {
            color: rgba(255,255,255,0.9);
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
        }

        /* Scroll hint */
        .scroll-hint {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            color: rgba(255,255,255,0.25);
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            animation: fadeInUp 1s ease 1.5s both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Subtle vignette */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 500;
            background: radial-gradient(ellipse at center,
                transparent 45%,
                rgba(0,0,0,0.55) 100%
            );
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">← SYSTEM</a>
    <div class="vignette"></div>
    <div id="spiral-gallery"></div>
    <p class="scroll-hint">Scroll to explore</p>
    
    <script src="components/infinite-spiral/infinite-spiral.js?v=7"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const el = document.getElementById('spiral-gallery');
            if (!el || !window.InfiniteSpiral) return;

            const items = Array.from({ length: 20 }, (_, i) => ({
                src: `https://picsum.photos/seed/tbi-${i * 7 + 3}/900/600`,
                alt: `LOG-${String(i + 1).padStart(3, '0')}`
            }));

            new window.InfiniteSpiral(el, {
                items,
                animationMode: 'scroll',
                speed: 0.4,
                direction: 'up',
                radius: 240,          // reference: medium circle radius
                cardWidth: 300,       // wide landscape cards like reference
                cardHeight: 190,
                verticalSpacing: 95,  // clear vertical separation
                perspective: 1000,    // reference: ~standard perspective
                cardsPerTurn: 7,      // ~7 visible in reference
                rotation: 0,
                cardRadius: 14,
                centerScale: 1.28,    // front card notably larger
                edgeFade: 0.5,        // fade starts at 50% — fewer visible cards
                edgeBlur: 12,
                pauseOnHover: false,
                imageFit: 'cover',
                grayscale: 0,
                scrollVelocityMultiplier: 0.013
            });
        });
    </script>
</body>
</html>
