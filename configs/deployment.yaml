# Deployment Configuration for NVIDIA Jetson Xavier

deployment:
  target: "jetson_xavier"
  precision: "fp16"           # fp32, fp16, int8
  workspace_size: 1 << 30     # 1GB TensorRT workspace size
  onnx_opset: 17

inference:
  source_rgb: "data/raw/FLIR/rgb"
  source_thermal: "data/raw/FLIR/thermal"
  fps_limit: 30
  enable_display: true
  save_output: true
  output_path: "logs/inference_output.avi"

alert_system:
  restricted_roi:             # Normalized polygon coordinates [(x1,y1), (x2,y2), ...] defining the restricted border area
    - [0.1, 0.4]
    - [0.9, 0.4]
    - [0.9, 0.9]
    - [0.1, 0.9]
  min_alert_frames: 3         # Require 3 consecutive frames of intrusion detection before triggering alert
  alert_cooldown_seconds: 5   # Cooldown between consecutive alerts
