# Model and Training Configuration for Thermal-Border-Intrusion

model:
  rgb:
    backbone: "resnet18"       # Backbone architecture for RGB feature extraction
    pretrained: true          # Load ImageNet weights
    output_dim: 256           # Output feature dimension before fusion

  thermal:
    backbone: "resnet18"       # Backbone architecture for Thermal feature extraction
    pretrained: true
    output_dim: 256

  fusion:
    method: "concat"           # Option: concat, weighted, attention
    hidden_dim: 256           # Dimensionality after fusion layers
    dropout: 0.3

  detector:
    num_classes: 3            # person, bicycle, car
    img_size: [640, 640]
    confidence_threshold: 0.25
    iou_threshold: 0.45

training:
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  device: "cuda"              # Or "cpu"
  save_dir: "weights"
  log_dir: "logs"

preprocessing:
  resize_dims: [640, 640]
  normalize:
    rgb_mean: [0.485, 0.456, 0.406]
    rgb_std: [0.229, 0.224, 0.225]
    thermal_mean: [0.485]
    thermal_std: [0.229]
